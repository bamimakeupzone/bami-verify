<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - Bami Makeup Zone</title>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abyssinica+SIL&family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000; /* Pure Dark Black */
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1a1a1a;
            border: 2px solid #d4af37; /* Gold border */
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }
        
        /* Logo Text */
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #FFD700; /* Pure Gold */
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #FFD700; /* Pure Gold */
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
        
        .verified-badge {
            font-family: 'Montserrat', sans-serif;
            color: #4CAF50;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #4CAF50;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        
        /* Heading Text */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 15px;
            color: #ffffff;
        }
        
        /* Student Name */
        .student-name {
            font-family: 'Abyssinica SIL', serif; /* Amharic font */
            font-size: 38px;
            color: #d4af37;
            font-style: italic;
            margin: 25px 0;
            word-wrap: break-word;
        }
        
        .details {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
            font-weight: 300;
        }
        
        /* Certificate Number & Date Footer */
        .footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 30px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">BAMI</div>
        <div class="sub-logo">MAKEUP ZONE</div>
        
        <div class="verified-badge">✓ VERIFIED CERTIFICATE</div>
        
        <h1>This certifies that</h1>
        <div class="student-name">በአምላክ አለማየሁ </div> <!-- Replace with Amharic full name -->
        
        <div class="details">
            has successfully completed the professional training program in<br>
            <strong>Makeup Artistry Masterclass</strong>
        </div>
        
        <div class="footer">
            Certificate No: BMZ-0001<br>
            Date of Completion: 2026-10-28<br>
            Issued by Bami Makeup Zone
        </div>
    </div>

</body>
</html>
