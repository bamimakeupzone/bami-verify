<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - Bami Makeup Zone</title>
    
    <!-- Load Google Fonts for English text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1a1a1a;
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #FFD700;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
        
        .verified-badge {
            font-family: 'Montserrat', sans-serif;
            color: #4CAF50;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #4CAF50;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 15px;
            color: #ffffff;
        }
        
        /* --- ONLY THE SIZE CHANGED HERE (Font type is still Playfair Display) --- */
        .student-name {
            font-family: 'Playfair Display', serif; /* Kept exactly the same */
            font-size: 28px; /* Only the size was reduced */
            font-weight: 600;
            color: #d4af37;
            margin: 25px 0;
            word-wrap: break-word;
            line-height: 1.3;
        }
        
        /* --- JUSTIFICATION ADDED HERE (Font type is still Montserrat) --- */
        .details {
            font-family: 'Montserrat', sans-serif; /* Kept exactly the same */
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
            font-weight: 300;
            text-align: justify;        /* Ensures the paragraph is justified */
            text-align-last: center;    /* Keeps the last line looking balanced */
        }
        
        .footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 30px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">BAMI</div>
        <div class="sub-logo">MAKEUP ZONE</div>
        
        <div class="verified-badge">✓ VERIFIED CERTIFICATE</div>
        
        <h1>This certifies that</h1>
        
        <div class="student-name">FERIHA SIRGOTA MOHAMMED</div> 
        
        <div class="details">
            has successfully completed the professional training program in<br>
            <strong>Makeup Artistry Masterclass</strong>
        </div>
        
        <div class="footer">
            Certificate No: BMZ-0002<br>
            Date of Completion: 2026-10-29<br>
            Issued by Bami Makeup Zone
        </div>
    </div>

</body>
</html>
